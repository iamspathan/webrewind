# Local compose stack — `docker compose up` brings up the server, the
# client (nginx), and a MinIO object store. Captured frames and GIFs are
# uploaded to MinIO and served directly from it; nginx only proxies
# /screenshots (API + SSE), /health, /docs, /metrics.

services:
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      # 9000: S3 API (also the URL the browser uses to fetch images).
      # 9011 → 9001: MinIO web console. Remapped on the host because 9001
      # is commonly taken by other local dev processes.
      - "9000:9000"
      - "9011:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # One-shot bucket bootstrap: waits for MinIO, creates the bucket if
  # missing, and makes it publicly readable so the browser can load
  # captured images with a plain <img src>.
  minio-init:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/webrewind &&
      mc anonymous set download local/webrewind &&
      echo 'bucket ready'
      "
    restart: "no"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      # CLIENT_ORIGIN matches the nginx-exposed client port; the server's
      # CORS middleware reads this. Not strictly needed when the client
      # proxies to the server (same-origin), but defensive for direct hits.
      CLIENT_ORIGIN: http://localhost:8080
      # PUBLIC_BASE_URL is the URL the CLIENT sees the server at. Used
      # for /screenshots and /screenshots/events/<id> streamUrl — NOT for
      # image URLs (those go direct to MinIO via MINIO_PUBLIC_URL).
      PUBLIC_BASE_URL: http://localhost:8080
      TRUST_PROXY: "true"
      # Internal endpoint the server uses to PUT/DELETE objects.
      MINIO_ENDPOINT: http://minio:9000
      # External endpoint the browser uses to GET images. On a real
      # deployment this becomes https://objects.example.com.
      MINIO_PUBLIC_URL: http://localhost:9000
      MINIO_BUCKET: webrewind
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      minio-init:
        condition: service_completed_successfully
    expose:
      - "3200"
    ports:
      # Expose server directly for debugging; remove in production.
      # 3201 on the host so a locally-running dev server on 3200 doesn't
      # clash. Inside the compose network nginx still hits server:3200.
      - "3201:3200"
    restart: unless-stopped
    # Chromium sandbox requires either --no-sandbox (which we pass in the
    # launch args) or kernel capabilities granted via docker. Using
    # --no-sandbox is fine inside an already-isolated container.
    # Increase /dev/shm — Chromium writes rendering caches here and the
    # 64 MB default is easy to exhaust on heavier pages.
    shm_size: 1gb
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3200/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        # Empty — lets the SPA use same-origin /screenshots etc, which
        # nginx (inside this container) proxies to the server service.
        VITE_API_BASE_URL: ""
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  minio-data:
