# Nginx config for the client image. Single-origin deployment: API calls
# and SSE streams are proxied to the server container under the same
# hostname, so the browser never has to do CORS.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — anything not matched by a file or the proxy blocks below
    # should resolve to index.html so client-side routing works.
    location / {
        try_files $uri /index.html;
    }

    # Long-poll + SSE friendly defaults. Buffering off is critical: otherwise
    # Nginx will hold progress events until the response finishes.
    # Note: /images is NOT proxied — image URLs now point directly at MinIO.
    location ~ ^/(screenshots|health|docs|metrics) {
        proxy_pass http://server:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Cache immutable hashed Vite assets aggressively.
    location ~* \.(js|css|woff2?|ttf|eot|png|jpg|gif|svg|webp)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
